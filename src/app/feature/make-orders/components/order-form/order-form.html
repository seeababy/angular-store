<div class="order-form">
  @if (user(); as user) {

  <div class="card">
    <div class="title">{{ 'order.contactData' | translate }}</div>
    <form [formGroup]="formGroup" class="form">
      <div class="row">
        <div class="field readonly">
          <div class="label">{{ 'order.firstName' | translate }}</div>
          <div class="value">{{ user.firstName }}</div>
        </div>

        <div class="field readonly">
          <div class="label">{{ 'order.lastName' | translate }}</div>
          <div class="value">{{ user.lastName }}</div>
        </div>
      </div>

      <div class="row">
        <div class="field readonly">
          <div class="label">{{ 'order.email' | translate }}</div>
          <div class="value">{{ user.email }}</div>
        </div>

        <div class="field readonly">
          <div class="label">{{ 'order.phone' | translate }}</div>
          <div class="value">{{ user.phoneNumber }}</div>
        </div>
      </div>

      <div class="row">
        <mat-form-field class="field" appearance="outline">
          <input matInput [placeholder]="'order.address' | translate" formControlName="address" />
        </mat-form-field>

        <mat-form-field class="field" appearance="outline">
          <input matInput [placeholder]="'order.city' | translate" formControlName="city" />
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field class="field" appearance="outline">
          <input matInput [placeholder]="'order.postalCode' | translate" formControlName="postalCode" />
        </mat-form-field>
      </div>

      <mat-form-field class="notes" appearance="outline">
        <textarea matInput [placeholder]="'order.notes' | translate" formControlName="notes"></textarea>
      </mat-form-field>
    </form>
  </div>

  }
</div>
