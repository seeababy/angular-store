<mat-expansion-panel class="order-panel" (opened)="opened = true" (closed)="opened = false">
  <mat-expansion-panel-header class="header">
    <div class="header-content">
      <div class="left">
        <div class="title">Замовлення №{{ order()?.orderNumber }}</div>

        @if (!opened) {
        <div class="images">
          @for (item of order().items; track item.productId) {
          <img [src]="cdn + item.image" alt="product" />
          }
        </div>
        }
      </div>

      <div class="right desktop-total">
        <div class="total">{{ total() }} ₴</div>
      </div>
    </div>
  </mat-expansion-panel-header>

  <div class="details">
    @for (item of order().items; track item.productId) {
    <app-order-card [item]="item" />
    }

    <div class="total mobile-total">{{ total() }} ₴</div>
  </div>
</mat-expansion-panel>
