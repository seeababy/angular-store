@if (!isAuthorized()) {
<button class="user-btn" [routerLink]="['/', AppRoutesConfig.Auth, AppRoutesConfig.Login]">
  <mat-icon class="icon" svgIcon="user"></mat-icon>
</button>
} @else {

<button class="user-btn avatar-btn" [matMenuTriggerFor]="userMenu" [style.background]="color()">
  {{ shortName() }}
</button>

<mat-menu #userMenu="matMenu" class="user-menu">
  <button mat-menu-item class="menu-item" [routerLink]="['/', AppRoutesConfig.Office]">
    <mat-icon svgIcon="settings"></mat-icon>
    <span>{{ 'userBadge.settings' | translate }}</span>
  </button>

  <div class="menu-divider"></div>

  <button mat-menu-item class="menu-item" (click)="logout()">
    <mat-icon svgIcon="logout"></mat-icon>
    <span>{{ 'userBadge.logout' | translate }}</span>
  </button>
</mat-menu>
}
